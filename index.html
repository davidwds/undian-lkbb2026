<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undian Urutan Tampil LKBB</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 { margin-bottom: 20px; color: #1a73e8; }
    .form-group { text-align: left; margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { background: #ccc; }
    #resultBox {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      background: #e8f0fe;
      display: none;
    }
    .nomor-urut {
      font-size: 48px;
      font-weight: bold;
      color: #1a73e8;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Undian Urutan Tampil</h2>
  <form id="undianForm">
    <div class="form-group">
      <label>Nama Sekolah / Kontingen</label>
      <input type="text" id="namaSekolah" required placeholder="Contoh: SMAN 1 Jakarta">
    </div>
    <div class="form-group">
      <label>Provinsi</label>
      <input type="text" id="provinsi" required placeholder="Contoh: DKI Jakarta">
    </div>
    <button type="submit" id="btnSubmit">Kocok Nomor Urut</button>
  </form>

  <div id="resultBox">
    <h3>Nomor Urut Anda:</h3>
    <div class="nomor-urut" id="nomorDisplay">-</div>
    <p>Data berhasil tersimpan ke sistem!</p>
  </div>
</div>

<script>
  // GANTI URL DI BAWAH INI DENGAN URL GOOGLE APPS SCRIPT ANDA
  const SCRIPT_URL = "URL_WEB_APP_GOOGLE_SCRIPT_ANDA";

  document.getElementById('undianForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnSubmit');
    const resultBox = document.getElementById('resultBox');
    btn.disabled = true;
    btn.innerText = "Mengambil Nomor...";

    const payload = {
      namaSekolah: document.getElementById('namaSekolah').value,
      provinsi: document.getElementById('provinsi').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if(data.result === 'success') {
        document.getElementById('nomorDisplay').innerText = data.nomor;
        resultBox.style.display = 'block';
        document.getElementById('undianForm').style.display = 'none';
      } else {
        alert("Gagal: " + data.message);
        btn.disabled = false;
        btn.innerText = "Kocok Nomor Urut";
      }
    })
    .catch(err => {
      alert("Terjadi kesalahan koneksi.");
      btn.disabled = false;
      btn.innerText = "Kocok Nomor Urut";
    });
  });
</script>

</body>
</html>
