<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengundian Urutan Tampil LKBB - Live Zoom</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
    p.sub { text-align: center; color: #94a3b8; margin-bottom: 25px; }
    
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btnStart { background: #22c55e; color: white; }
    #btnStart:hover { background: #16a34a; }
    #btnStop { background: #ef4444; color: white; }
    #btnStop:hover { background: #dc2626; }
    button:disabled { background: #475569 !important; opacity: 0.5; cursor: not-allowed; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .prov-name {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .number-box {
      font-size: 36px;
      font-weight: bold;
      color: #f59e0b;
      background: #0f172a;
      border-radius: 6px;
      padding: 10px 0;
      border: 1px solid #475569;
    }
    .card.done { border-color: #38bdf8; }
    .card.done .number-box { color: #38bdf8; }
  </style>
</head>
<body>

  <h1>UNDIAN URUTAN TAMPIL LKBB</h1>
  <p class="sub">Pengocokan Serentak 30 Provinsi Secara Transparan</p>

  <div class="controls">
    <button id="btnStart" onclick="startRoll()">▶ Mulai Acak Semuanya</button>
    <button id="btnStop" onclick="stopRoll()" disabled>⏹ Hentikan & Kunci Nomor</button>
  </div>

  <div class="grid-container" id="grid"></div>

<script>
  // Daftar 30 Provinsi (Bisa disesuaikan nama-namanya)
  const daftarProvinsi = [
    "DKI Jakarta", "Jawa Barat", "Jawa Tengah", "Jawa Timur", "Banten",
    "D.I. Yogyakarta", "Bali", "Lampung", "Sumatra Selatan", "Sumatra Utara",
    "Sumatra Barat", "Riau", "Jambi", "Bengkulu", "Aceh",
    "Kalimantan Barat", "Kalimantan Tengah", "Kalimantan Selatan", "Kalimantan Timur", "Kalimantan Utara",
    "Sulawesi Selatan", "Sulawesi Utara", "Sulawesi Tengah", "Sulawesi Tenggara", "Gorontalo",
    "Nusa Tenggara Barat", "Nusa Tenggara Timur", "Maluku", "Papua", "Papua Barat"
  ];

  let intervalId = null;
  const grid = document.getElementById('grid');

  // Render awal 30 kotak
  function initGrid() {
    grid.innerHTML = '';
    daftarProvinsi.forEach((prov, i) => {
      grid.innerHTML += `
        <div class="card" id="card-${i}">
          <div class="prov-name">${i+1}. ${prov}</div>
          <div class="number-box" id="num-${i}">?</div>
        </div>
      `;
    });
  }

  // Efek animasi angka berjalan cepat di semua kotak
  function startRoll() {
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled = false;
    
    intervalId = setInterval(() => {
      daftarProvinsi.forEach((_, i) => {
        document.getElementById(`num-${i}`).innerText = Math.floor(Math.random() * 30) + 1;
      });
    }, 50); // Kecepatan acak (ms)
  }

  // Menghentikan acakan dan menentukan nomor 1-30 secara Unik (Tanpa Duplikat)
  function stopRoll() {
    clearInterval(intervalId);
    document.getElementById('btnStop').disabled = true;

    // Generate Array [1, 2, ..., 30] lalu di-shuffle
    let nomorUrut = Array.from({length: 30}, (_, i) => i + 1);
    
    // Algoritma Fisher-Yates Shuffle
    for (let i = nomorUrut.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [nomorUrut[i], nomorUrut[j]] = [nomorUrut[j], nomorUrut[i]];
    }

    // Masukkan nomor unik ke masing-masing kotak provinsi
    daftarProvinsi.forEach((_, i) => {
      const elNum = document.getElementById(`num-${i}`);
      const elCard = document.getElementById(`card-${i}`);
      elNum.innerText = nomorUrut[i] < 10 ? '0' + nomorUrut[i] : nomorUrut[i];
      elCard.classList.add('done');
    });
  }

  initGrid();
</script>
</body>
</html>
