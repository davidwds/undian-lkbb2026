<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengundian Urutan Tampil LKBB - Live Zoom</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
    p.sub { text-align: center; color: #94a3b8; margin-bottom: 25px; }
    
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btnStart { background: #22c55e; color: white; }
    #btnStart:hover { background: #16a34a; }
    #btnStop { background: #ef4444; color: white; }
    #btnStop:hover { background: #dc2626; }
    #btnReset { background: #64748b; color: white; }
    #btnReset:hover { background: #475569; }
    button:disabled { background: #334155 !important; opacity: 0.5; cursor: not-allowed; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    .prov-name {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .number-box {
      font-size: 36px;
      font-weight: bold;
      color: #f59e0b;
      background: #0f172a;
      border-radius: 6px;
      padding: 10px 0;
      border: 1px solid #475569;
    }
    .card.done { border-color: #38bdf8; }
    .card.done .number-box { color: #38bdf8; background: #0284c71a; }
  </style>
</head>
<body>

  <h1>UNDIAN URUTAN TAMPIL LKBB</h1>
  <p class="sub">Pengocokan Serentak Secara Transparan via Zoom</p>

  <div class="controls">
    <button id="btnStart" onclick="startRoll()">▶ Mulai Acak Semuanya</button>
    <button id="btnStop" onclick="stopRoll()" disabled>⏹ Hentikan & Kunci Nomor</button>
    <button id="btnReset" onclick="resetGrid()">🔄 Reset</button>
  </div>

  <div class="grid-container" id="grid"></div>

<script>
  // Daftar Provinsi (Sudah di-sorting alfabetis A-Z)
  const daftarProvinsi = [
    "ACEH",
    "BALI",
    "BANGKA BELITUNG",
    "BANTEN",
    "BENGKULU",
    "DI YOGYAKARTA",
    "DKI JAKARTA",
    "GORONTALO",
    "JAMBI",
    "JAWA BARAT",
    "JAWA TENGAH",
    "JAWA TIMUR",
    "KALIMANTAN BARAT",
    "KALIMANTAN SELATAN",
    "KALIMANTAN TENGAH",
    "KALIMANTAN TIMUR",
    "KALIMANTAN UTARA",
    "KEPULAUAN RIAU",
    "LAMPUNG",
    "NTB",
    "NTT",
    "RIAU",
    "SULAWESI BARAT",
    "SULAWESI SELATAN",
    "SULAWESI TENGAH",
    "SULAWESI TENGGARA",
    "SULAWESI UTARA",
    "SUMATERA BARAT",
    "SUMATERA SELATAN",
    "SUMATERA UTARA"
  ];

  let intervalId = null;
  const grid = document.getElementById('grid');

  // Render awal kotak provinsi
  function initGrid() {
    grid.innerHTML = '';
    daftarProvinsi.forEach((prov, i) => {
      grid.innerHTML += `
        <div class="card" id="card-${i}">
          <div class="prov-name" title="${prov}">${i+1}. ${prov}</div>
          <div class="number-box" id="num-${i}">?</div>
        </div>
      `;
    });
  }

  // Mulai animasi angka acak cepat
  function startRoll() {
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled = false;
    document.getElementById('btnReset').disabled = true;
    
    intervalId = setInterval(() => {
      daftarProvinsi.forEach((_, i) => {
        document.getElementById(`num-${i}`).innerText = Math.floor(Math.random() * daftarProvinsi.length) + 1;
      });
    }, 50);
  }

  // Hentikan acakan dan kunci nomor unik (Fisher-Yates Shuffle)
  function stopRoll() {
    clearInterval(intervalId);
    document.getElementById('btnStop').disabled = true;
    document.getElementById('btnReset').disabled = false;

    let nomorUrut = Array.from({length: daftarProvinsi.length}, (_, i) => i + 1);
    
    for (let i = nomorUrut.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [nomorUrut[i], nomorUrut[j]] = [nomorUrut[j], nomorUrut[i]];
    }

    daftarProvinsi.forEach((_, i) => {
      const elNum = document.getElementById(`num-${i}`);
      const elCard = document.getElementById(`card-${i}`);
      elNum.innerText = nomorUrut[i] < 10 ? '0' + nomorUrut[i] : nomorUrut[i];
      elCard.classList.add('done');
    });
  }

  // Reset tampilan ke kondisi awal
  function resetGrid() {
    clearInterval(intervalId);
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled = true;
    initGrid();
  }

  initGrid();
</script>
</body>
</html>
